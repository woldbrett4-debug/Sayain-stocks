<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050817">
  <meta name="description" content="Dragon Ball Z inspired live stock chart dashboard">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Saiyan Stocks — HTZ Live Chart</title>
  <style>
    :root { color-scheme: dark; --cyan:#00d9ff; --purple:#a855f7; --green:#20f58a; }
    * { box-sizing:border-box }
    html,body { margin:0; width:100%; min-height:100%; background:#030611; color:#fff; font-family:Arial,Helvetica,sans-serif; }
    body { min-height:100svh; }
    .screen {
  min-height: 100vh;
  min-height: 100svh;
  background-color: #030611;
  background-image:
    linear-gradient(180deg, rgba(1,5,18,.12), rgba(1,5,18,.55)),
    url("./Dbz-background.jpg");
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  padding: env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom));
  box-sizing: border-box;
}
    }
    .topbar { display:flex; justify-content:space-between; align-items:center; padding:8px 4px; text-shadow:0 2px 8px #000; }
    .brand { font-weight:900; letter-spacing:1.5px; color:#fff; font-size:13px; }
    .live { color:var(--green); font-size:11px; font-weight:800; letter-spacing:1px; }
    .live:before { content:""; display:inline-block; width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 9px var(--green); }
    .ticker-panel {
      margin:clamp(95px,17vh,155px) auto 0; width:min(92%,560px); padding:10px 12px;
      background:rgba(3,8,24,.94); border:1px solid var(--cyan); border-radius:14px;
      box-shadow:0 0 16px rgba(0,217,255,.42),inset 0 0 14px rgba(0,217,255,.08);
    }
    .ticker-row { display:flex; gap:8px; align-items:center; }
    input {
      min-width:0; flex:1; border:1px solid #354b75; border-radius:9px; padding:11px 12px;
      color:#fff; background:#081329; font-size:16px; text-transform:uppercase; outline:none;
    }
    button {
      border:1px solid var(--cyan); border-radius:9px; background:linear-gradient(135deg,#063e71,#30105e);
      color:#fff; font-weight:800; padding:11px 14px; font-size:14px; box-shadow:0 0 10px #087cbb66;
    }
    .hint { color:#b9c8e8; font-size:10px; margin:7px 2px 0; }
    .chart-shell {
      width:min(96%,760px); height:clamp(285px,38vh,430px); margin:12px auto 0;
      border:1px solid var(--cyan); border-radius:13px; overflow:hidden; background:#050914;
      box-shadow:0 0 18px rgba(0,217,255,.5),0 0 35px rgba(168,85,247,.2);
    }
    #chart { width:100%; height:100%; }
    .watch {
      width:min(94%,700px); margin:12px auto 0; padding:10px;
      border:1px solid #a855f7; border-radius:12px; background:rgba(4,7,22,.94);
      box-shadow:0 0 16px rgba(168,85,247,.38);
    }
    .watch-title { text-align:center; font-weight:900; letter-spacing:1px; font-size:13px; margin-bottom:8px; }
    .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; }
    .chip { padding:7px 11px; border-radius:20px; border:1px solid #43557e; background:#0a1530; color:#eaf5ff; font-size:12px; }
    .chip.active { border-color:var(--green); color:var(--green); box-shadow:0 0 9px #20f58a55; }
    .addrow { display:flex; gap:7px; margin-top:8px; }
    .addrow input { font-size:13px; padding:8px 10px; }
    .addrow button { padding:8px 11px; font-size:12px; }
    .footer { text-align:center; margin:12px 0 4px; color:#ffe56b; font-weight:900; font-size:12px; letter-spacing:1px; text-shadow:0 2px 8px #000; }
    .notice { text-align:center; color:#d1d8ed; font-size:10px; margin:5px auto 0; max-width:520px; text-shadow:0 1px 4px #000; }
    @media (max-height:760px) {
      .ticker-panel { margin-top:12vh; }
      .chart-shell { height:34vh; min-height:235px; }
      .watch { margin-top:8px; }
    }
  </style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <div class="brand">⚡ SAIYAN STOCKS</div>
    <div class="live">CHART CONNECTION</div>
  </div>

  <section class="ticker-panel">
    <div class="ticker-row">
      <input id="ticker" value="HTZ" maxlength="15" aria-label="Stock ticker" placeholder="Enter ticker (e.g. HTZ)">
      <button id="load">LOAD CHART</button>
    </div>
    <div class="hint">Search any ticker symbol. The chart below is supplied by TradingView.</div>
  </section>

  <section class="chart-shell" aria-label="Live stock chart">
    <div id="chart"></div>
  </section>

  <section class="watch">
    <div class="watch-title">✦ MY WATCHLIST ✦</div>
    <div class="chips" id="chips">
      <button class="chip active" data-symbol="HTZ">HTZ</button>
    </div>
    <div class="addrow">
      <input id="addTicker" maxlength="15" placeholder="Add ticker symbol">
      <button id="add">+ ADD</button>
    </div>
  </section>

  <div class="footer">POWER UP YOUR PORTFOLIO</div>
  <div class="notice">Quotes may be delayed depending on exchange and data permissions. Not investment advice.</div>
</main>
<script>
  const tickerInput = document.getElementById('ticker');
  const chart = document.getElementById('chart');
  const chips = document.getElementById('chips');
  const watchlist = ['HTZ'];
  let active = 'HTZ';

  function loadChart(symbol) {
  symbol = (symbol || '').trim().toUpperCase().replace(/[^A-Z0-9:._-]/g, '');
  if (!symbol) return;

  active = symbol;
  tickerInput.

  chart.innerHTML = '';

  const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
const w = chart.clientWidth;
const h = chart.clientHeight;

canvas.width = w * dpr;
canvas.height = h * dpr;
ctx.scale(dpr, dpr);

ctx.fillStyle = '#030611';
ctx.fillRect(0, 0, w, h);

// Neon grid
ctx.strokeStyle = 'rgba(0,217,255,0.16)';
ctx.lineWidth = 1;

for (let i = 1; i < 7; i++) {
  const y = h * i / 7;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(w, y);
  ctx.stroke();
}

// Saiyan title
ctx.font = 'bold 18px Arial';
ctx.fillStyle = '#20f58a';
ctx.fillText('⚡ SAIYAN STOCKS', 15, 28);

ctx.font = '13px Arial';
ctx.fillStyle = '#00d9ff';
ctx.fillText(symbol + ' • NEON CHART', 15, 50);

// Demo candlesticks
const candles = 45;
const spacing = (w - 40) / candles;
let price = h * 0.57;

for (let i = 0; i < candles; i++) {
  const change = (Math.random() - 0.47) * 22;
  const nextPrice = price + change;
  const rising = nextPrice < price;
  const color = rising ? '#20f58a' : '#ff3158';
  const x = 20 + i * spacing;

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 9;

  ctx.beginPath();
  ctx.moveTo(x + spacing / 2, price - 10);
  ctx.lineTo(x + spacing / 2, nextPrice + 10);
  ctx.stroke();

  ctx.fillRect(
    x + 1,
    Math.min(price, nextPrice),
    Math.max(2, spacing - 3),
    Math.max(3, Math.abs(change))
  );

  price = nextPrice;
}

ctx.shadowBlur = 0;

ctx.fillStyle = '#20f58a';
ctx.font = 'bold 13px Arial';
ctx.fillText('⚡ SAIYAN MODE', 15, h - 15);

[...chips.querySelectorAll('.chip')].forEach(b =>
  b.classList.toggle('active', b.dataset.symbol === symbol)
);

  }
      const b = document.createElement('button');
      b.className = 'chip' + (symbol === active ? ' active' : '');
      b.textContent = symbol;
      b.dataset.symbol = symbol;
      b.addEventListener('click', () => loadChart(symbol));
      chips.appendChild(b);
    });
  }

  document.getElementById('load').addEventListener('click', () => loadChart(tickerInput.value));
  tickerInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadChart(tickerInput.value); });
  document.getElementById('add').addEventListener('click', () => {
    const symbol = document.getElementById('addTicker').value.trim().toUpperCase().replace(/[^A-Z0-9:._-]/g, '');
    if (!symbol) return;
    if (!watchlist.includes(symbol)) watchlist.push(symbol);
    document.getElementById('addTicker').value = '';
    renderChips();
    loadChart(symbol);
  });
  document.getElementById('addTicker').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('add').click(); });

  loadChart('HTZ');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
